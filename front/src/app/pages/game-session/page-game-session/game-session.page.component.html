<section class="header">
  <div></div>
  <ds-dropdown-container>
    @let cp = currentParticipantState.currentParticipant();
    <ds-dropdown-trigger>
      @if (cp?.type === 'player') {
        <app-avatar-view [player]="player()" [permissions]="{edit: false}" [size]="'m'"/>
      } @else {
        <div class="gm-badge">GM</div>
      }
    </ds-dropdown-trigger>
    <ds-dropdown-content>
      <ds-button [mode]="'tertiary'" [icon]="'logout'" (click)="logout()" >Logout</ds-button>
      <ds-button [mode]="'tertiary'" [icon]="'menu'" (click)="showAbout()" >About</ds-button>
    </ds-dropdown-content>
  </ds-dropdown-container>
</section>

<section class="main-content">
  <router-outlet />
</section>

<footer>
  <ds-bottom-bar
    (quickAction)="runQuickAction()"
    [eventCount]="eventCount()"
    (history)="goToEvents()"
    (me)="goToMyPlayerPage()"
    (notes)="goToNotes()"
    (session)="goToPlayerList()" />
</footer>
